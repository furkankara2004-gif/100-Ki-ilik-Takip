<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<title>100 Kişilik Takip</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1b1b1b;--line:#383838;--red:#c51f31;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:20px 14px 40px}
main{max-width:650px;margin:auto}.hero{padding:22px;border-radius:18px;background:linear-gradient(130deg,#a30e19,#171717 75%);box-shadow:0 10px 28px #0005}
.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;opacity:.8}.title{font-size:27px;font-weight:850;margin:5px 0 20px}
.stats{display:flex;justify-content:space-between;align-items:end}.caption{font-size:12px;opacity:.8}.big{font-size:40px;font-weight:900;line-height:1.2}.percent{font-size:30px;font-weight:850}
.track{height:9px;background:#ffffff30;border-radius:20px;overflow:hidden;margin-top:14px}.fill{height:100%;width:0;background:#fff;border-radius:20px;transition:width .2s}
.subrow{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-top:8px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px}.toolbar strong{font-size:17px}.hint{font-size:12px;color:var(--muted);margin-top:2px}
button{font:inherit;cursor:pointer}.filter,.reset{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#222;color:#fff;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.tile{min-height:59px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:#fff;font-weight:750;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile .mark{font-size:11px;color:#aaa}.tile.done{background:var(--red);border-color:var(--red)}.tile.done .mark{color:white}
.legend{display:flex;gap:15px;color:var(--muted);font-size:12px;margin:14px 2px 22px}
.footer{border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#181818}
.footer strong{font-size:14px}.footer small{display:block;color:var(--muted);margin-top:3px;font-size:11px}
.reset{background:#a71927;border:0;font-weight:700}.notice{text-align:center;color:var(--muted);font-size:12px;margin-top:13px}
@media(min-width:520px){.grid{grid-template-columns:repeat(10,minmax(0,1fr))}.tile{min-height:55px}}
</style>
</head>
<body>
<main>
<section class="hero">
<div class="eyebrow">KİŞİ TAKİP SİSTEMİ</div>
<div class="title">100 Kişilik Takip</div>
<div class="stats">
<div><div class="caption">Tamamlanan</div><div class="big" id="doneCount">0</div></div>
<div style="text-align:right"><div class="caption">İlerleme</div><div class="percent" id="percent">0%</div></div>
</div>
<div class="track"><div class="fill" id="progress"></div></div>
<div class="subrow"><span id="remaining">100 kişi kaldı</span><span>100 kişi</span></div>
</section>
<div class="toolbar">
<div><strong>Kişi listesi</strong><div class="hint">Kutulara dokunarak işaretle</div></div>
<button class="filter" id="filter">Tümü ▾</button>
</div>
<div class="grid" id="grid"></div>
<div class="legend"><span>⬛ Bekliyor</span><span style="color:#ef5968">■ Tamamlandı</span></div>
<section class="footer">
<div><strong>Takip verileri</strong><small id="saveStatus">Otomatik kayıt açık</small></div>
<button class="reset" id="reset">Sıfırla</button>
</section>
<div class="notice" id="notice" role="status">Başlamak için bir numaraya dokun.</div>
</main>
<script>
(()=>{
 const KEY='takip100_v1';
 let done=new Set(),filter='all';
 try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))done=new Set(v.filter(n=>Number.isInteger(n)&&n>=1&&n<=100));}catch(e){}
 const $=id=>document.getElementById(id);
 function save(){try{localStorage.setItem(KEY,JSON.stringify([...done]));$('saveStatus').textContent='Otomatik kaydedildi';}catch(e){$('saveStatus').textContent='Bu tarayıcıda kayıt yapılamadı';}}
 function render(){
  const grid=$('grid');grid.replaceChildren();
  for(let n=1;n<=100;n++){
   if(filter==='done'&&!done.has(n))continue;
   if(filter==='pending'&&done.has(n))continue;
   const b=document.createElement('button');b.type='button';b.className='tile'+(done.has(n)?' done':'');
   b.setAttribute('aria-label',n+'. kişi '+(done.has(n)?'tamamlandı':'bekliyor'));
   const number=document.createElement('span');number.textContent=n;
   const mark=document.createElement('span');mark.className='mark';mark.textContent=done.has(n)?'✓ Tamam':'○ Bekliyor';
   b.append(number,mark);
   b.addEventListener('click',()=>{if(done.has(n))done.delete(n);else done.add(n);save();render();$('notice').textContent=n+'. kişi '+(done.has(n)?'tamamlandı olarak işaretlendi.':'işareti kaldırıldı.');});
   grid.appendChild(b);
  }
  const count=done.size;$('doneCount').textContent=count;$('percent').textContent=count+'%';
  $('progress').style.width=count+'%';$('remaining').textContent=(100-count)+' kişi kaldı';
  $('filter').textContent=filter==='all'?'Tümü ▾':filter==='done'?'Tamamlananlar ▾':'Bekleyenler ▾';
 }
 $('filter').addEventListener('click',()=>{filter=filter==='all'?'done':filter==='done'?'pending':'all';render();});
 $('reset').addEventListener('click',()=>{if(!confirm('Tüm işaretlemeleri sıfırlamak istiyor musun?'))return;done.clear();filter='all';save();render();$('notice').textContent='Tüm işaretlemeler sıfırlandı.';});
 render();
})();
</script>
</body>
</html>
