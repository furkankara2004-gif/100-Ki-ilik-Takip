
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/ornek/yuzkisiliktakip
          mkdir -p app/src/main/res/drawable-nodpi

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/ornek/yuzkisiliktakip/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp selami_icon.png app/src/main/assets/selami_icon.png
          cp selami_icon.png app/src/main/res/drawable-nodpi/app_icon.png

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ornek.yuzkisiliktakip'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.ornek.yuzkisiliktakip'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: selami-12-hafta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
